name: ppt-workflow
description: PPT-workflow
execution_mode: auto
tasks:
    - id: step-1
      description: 让 AI 扮演演示设计专家，分析你提供的原始素材，梳理出清晰的逻辑结构，并输出分页大纲。这一步是确保 PPT 不跑题的关键。
      prompt: |-
        “你现在是一位专业的演示文稿设计师。我需要制作一份关于 [输入你的主题] 的 HTML 演示文稿。
        受众是 [输入受众，如：公司高管/潜在客户]，核心目标是 [输入目标，如：汇报Q3业绩/产品推介]。
        请帮我设计一份包含 [X] 页的大纲。要求：
        逻辑清晰，包含封面、目录、核心内容、总结与致谢页。
        每一页大纲需包含：页码、主标题、3-5个核心要点（Bullet Points）。
        请先只输出大纲，等我确认后再进行下一步。”
      allowed_tools:
        - Glob
        - Grep
        - LS
        - ReadMemory
        - View
        - ViewImage
      difficulty: hard
    - id: step-2
      description: 在生成具体代码前，先“定调”。明确 HTML/CSS 的技术栈和视觉规范，确保后续生成的每一页风格统一。
      prompt: |-
        “大纲已确认。接下来我们将逐页生成 HTML 代码。在开始之前，请先设定全局的视觉与技术规范：
        技术栈：使用纯 HTML5 + CSS3（或指定 TailwindCSS），单文件结构，不依赖外部复杂框架。
        尺寸约束：固定比例为 16:9（例如 1920x1080px 或 1200x675px）。
        视觉风格：[如：现代简约/深色科技风/商务蓝]，请给出推荐的字体搭配和主色调色值。
        交互要求：包含简单的键盘左右键翻页导航功能。
        请输出这套全局 CSS 样式代码和基础的 HTML 骨架模板，我将把它作为后续页面的基础。”
      allowed_tools:
        - Edit
        - Grep
        - LS
        - ReadMemory
        - Skill
        - TodoWrite
        - View
        - ViewImage
        - WebSearch
      difficulty: hard
    - id: step-3
      description: 采用“流水线”模式，每次让 AI 生成 1-2 页的完整代码。这能最大程度保证排版细节和代码的完整性。
      prompt: |-
        “请根据我们确认的大纲和全局样式规范，生成第 [X] 页的 HTML 代码。
        要求：
        严格遵循 16:9 的固定尺寸容器。
        所有样式必须内联在 <style> 标签中，确保单文件可独立运行。
        文本使用语义化标签（如 <h1>, <p>, <ul>）包裹，便于后续可能的转换。
        如果该页需要配图或图表，请使用占位符（如 [图表占位]）或生成 SVG 矢量图形。
        请输出完整的、可直接在浏览器运行的 HTML 代码。”
      allowed_tools:
        - AskUser
        - Bash
        - Diff
        - Edit
        - Fetch
        - Glob
        - Grep
        - LS
        - ReadMemory
        - Skill
        - TodoWrite
        - View
        - ViewImage
        - Write
        - WriteMemory
      difficulty: hard
      depends_on:
        - step-1
        - step-2
